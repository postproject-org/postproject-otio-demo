name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "31 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: postproject-org/postproject
          ref: main
          path: postproject
      - uses: actions/checkout@v7
        with:
          repository: postproject-org/postproject-openassetio-manager
          ref: main
          path: manager
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --release --locked -p postproject-ffi
        working-directory: postproject
      - run: python -m pip install ./postproject/python ./manager . pytest
      - run: python -m pip install git+https://github.com/OpenAssetIO/otio-openassetio.git@ee762d7d24670f84c30baa6149123b6d252a9969
      - run: pytest
        env:
          POSTPROJECT_LIBRARY: ${{ github.workspace }}/postproject/target/release/libpostproject.so

