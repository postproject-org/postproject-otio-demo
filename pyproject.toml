[project]
name = "postproject-otio-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openassetio>=1.0.2,<2",
  "openassetio-mediacreation>=1.0.0a13,<2",
  "opentimelineio>=0.18.1,<0.19",
  "postproject>=0.4.0a1,<0.5",
  "postproject-openassetio-manager>=0.2,<0.3",
]
description = "OTIO-through-OpenAssetIO demonstration for PostProject"
readme = "README.md"
license = "Apache-2.0"

[project.scripts]
postproject-otio-demo = "postproject_otio_demo:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["postproject_otio_demo"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

